<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leonardo Pedra | Personal Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --crimson-deep: #5c0d0d;
    --blood: #c41f2e;
    --blood-bright: #e63946;
    --off-white: #f3ede2;
    --charcoal: #0f0c0c;
    --steel: #8a7d78;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--charcoal);
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    font-family: 'Barlow', sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(196,31,46,0.25), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(92,13,13,0.4), transparent 50%),
      var(--charcoal);
  }

  @media (prefers-reduced-motion: no-preference) {
    .card { animation: rise 0.7s cubic-bezier(.2,.7,.2,1) both; }
    .slash { animation: sweep 1s cubic-bezier(.2,.7,.2,1) both; animation-delay: .15s; }
  }
  @keyframes rise { from { opacity:0; transform: translateY(18px); } to { opacity:1; transform:none; } }
  @keyframes sweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  .card {
    width: 100%;
    max-width: 380px;
    background: linear-gradient(165deg, #290606 0%, #150404 60%, #0c0303 100%);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.7), 0 0 0 1px rgba(230,57,70,0.15);
    position: relative;
  }

  .hero {
    position: relative;
    padding: 36px 28px 26px;
    text-align: center;
    overflow: hidden;
  }

  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 30% 20%, rgba(196,31,46,0.35), transparent 55%),
      linear-gradient(180deg, rgba(196,31,46,0.12), transparent 70%);
    pointer-events: none;
  }

  .logo {
    width: 100%;
    max-width: 300px;
    margin: 0 auto 6px;
    display: block;
    filter: drop-shadow(0 8px 18px rgba(0,0,0,0.5));
    position: relative;
    border-radius: 10px;
  }

  .role-tag {
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-weight: 600;
    letter-spacing: 0.32em;
    font-size: 11px;
    color: var(--blood-bright);
    text-transform: uppercase;
    position: relative;
  }

  .slash {
    height: 3px;
    width: 100%;
    background: linear-gradient(90deg, transparent, var(--blood) 15%, var(--blood-bright) 50%, var(--blood) 85%, transparent);
    transform-origin: left;
    clip-path: polygon(3% 0, 100% 0, 97% 100%, 0% 100%);
  }

  .contact {
    padding: 26px 28px 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 4px;
    border-bottom: 1px solid rgba(243,237,226,0.08);
    text-decoration: none;
    color: var(--off-white);
    transition: transform .15s ease, background .15s ease;
  }
  .row:last-child { border-bottom: none; }

  .row:active { transform: scale(0.98); background: rgba(196,31,46,0.08); }

  .icon {
    width: 34px;
    height: 34px;
    flex: 0 0 34px;
    border-radius: 9px;
    background: linear-gradient(155deg, rgba(196,31,46,0.22), rgba(196,31,46,0.06));
    border: 1px solid rgba(230,57,70,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon svg { width: 17px; height: 17px; stroke: var(--blood-bright); }

  .row-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .row-label {
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--steel);
  }
  .row-value {
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-weight: 500;
    font-size: 15.5px;
    color: var(--off-white);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .qr-panel {
    margin: 22px 20px 26px;
    background: var(--off-white);
    border-radius: 16px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    position: relative;
    box-shadow: 0 14px 30px -12px rgba(0,0,0,0.55);
  }

  .qr-panel::before {
    content: "";
    position: absolute;
    top: -1px; left: 16px; right: 16px;
    height: 5px;
    background: var(--blood);
    border-radius: 0 0 6px 6px;
  }

  .qr-panel img {
    width: 168px;
    height: 168px;
    display: block;
    border-radius: 6px;
  }

  .qr-caption {
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--crimson-deep);
    text-align: center;
  }
  .qr-sub {
    font-family: 'Barlow', sans-serif;
    font-size: 11.5px;
    color: #7a6f6a;
    text-align: center;
    line-height: 1.4;
  }

  .footer-tag {
    text-align: center;
    padding: 0 20px 26px;
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-size: 10.5px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--steel);
  }
</style>
</head>
