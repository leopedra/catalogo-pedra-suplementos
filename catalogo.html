<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de productos | Pedra Suplementos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --crimson-deep: #5c0d0d;
    --blood: #c41f2e;
    --blood-bright: #e63946;
    --off-white: #f3ede2;
    --charcoal: #0f0c0c;
    --steel: #8a7d78;
    --card-bg: #1a0a0a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { background: var(--charcoal); }

  body {
    font-family: 'Barlow', sans-serif;
    color: var(--off-white);
    background:
      radial-gradient(circle at 15% 5%, rgba(196,31,46,0.20), transparent 45%),
      radial-gradient(circle at 85% 95%, rgba(92,13,13,0.35), transparent 50%),
      var(--charcoal);
    padding: 28px 16px 60px;
  }

  .wrap { max-width: 1100px; margin: 0 auto; }

  header {
    text-align: center;
    padding: 20px 0 28px;
  }

  header .eyebrow {
    font-family: 'Barlow Semi Condensed', sans-serif;
    color: var(--blood-bright);
    font-weight: 600;
    letter-spacing: .04em;
    font-size: 14px;
  }

  header h1 {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: clamp(34px, 7vw, 56px);
    letter-spacing: .01em;
    margin-top: 6px;
    text-transform: uppercase;
  }

  header p.sub {
    color: var(--steel);
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-size: 15px;
    margin-top: 8px;
  }

  .whatsapp-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 18px;
    background: var(--blood);
    color: var(--off-white);
    text-decoration: none;
    padding: 10px 20px;
    border-radius: 999px;
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-weight: 600;
    font-size: 15px;
  }

  /* filtros de categoria */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin: 28px 0 8px;
  }

  .filters button {
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-weight: 600;
    font-size: 13px;
    background: transparent;
    color: var(--steel);
    border: 1px solid rgba(230,57,70,0.25);
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: all .2s ease;
  }

  .filters button:hover { border-color: var(--blood-bright); color: var(--off-white); }

  .filters button.active {
    background: var(--blood);
    border-color: var(--blood);
    color: var(--off-white);
  }

  /* seções por categoria */
  .category {
    margin-top: 36px;
  }

  .category h2 {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: 26px;
    text-transform: uppercase;
    letter-spacing: .01em;
  }

  .category .count {
    color: var(--blood-bright);
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-size: 13px;
    font-weight: 600;
    margin-top: 2px;
  }

  .category .rule {
    height: 3px;
    width: 100%;
    margin: 12px 0 20px;
    background: linear-gradient(90deg, var(--blood) 0%, rgba(196,31,46,0.15) 55%, transparent 100%);
    border-radius: 2px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px;
  }

  .product {
    background: linear-gradient(165deg, #2a0808 0%, #170505 60%, #0d0303 100%);
    border: 1px solid rgba(230,57,70,0.12);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .product .photo {
    width: 100%;
    aspect-ratio: 4 / 5;
    border-radius: 10px;
    overflow: hidden;
    background: radial-gradient(circle at 50% 30%, rgba(196,31,46,0.18), transparent 70%), #100404;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .product .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .product .photo.placeholder svg {
    width: 40%;
    height: 40%;
    opacity: .35;
    stroke: var(--steel);
  }

  .product .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }

  .product .brand {
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: .04em;
    color: var(--blood-bright);
    text-transform: uppercase;
  }

  .product .price {
    background: var(--blood);
    color: var(--off-white);
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-weight: 700;
    font-size: 13px;
    padding: 5px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .product .name {
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-weight: 600;
    font-size: 17px;
  }

  .product .meta {
    display: flex;
    gap: 16px;
    border-top: 1px solid rgba(230,57,70,0.12);
    padding-top: 10px;
    margin-top: auto;
  }

  .product .meta div {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .product .meta span.label {
    font-size: 10px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--steel);
  }

  .product .meta span.value {
    font-size: 13px;
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-weight: 500;
  }

  .flavors-note {
    margin-top: 18px;
    background: rgba(230,57,70,0.06);
    border: 1px dashed rgba(230,57,70,0.25);
    border-radius: 14px;
    padding: 16px 18px;
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: var(--off-white);
  }

  .flavors-note strong { color: var(--blood-bright); }

  footer {
    text-align: center;
    margin-top: 50px;
    padding-top: 20px;
    border-top: 1px solid rgba(230,57,70,0.12);
    color: var(--steel);
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-size: 13px;
  }

  footer .price-note {
    display: block;
    margin-top: 6px;
    font-size: 12px;
    opacity: .8;
  }
</style>
</head>

   cada item dessa categoria, então substitua os 7 nomes/preços pelos reais. */

const flavorsNote = `
  <strong>Consulte todos los sabores</strong><br>
  Linha Whey Grego Bar (40g – 11g de proteína): Brigadeiro, Beijinho, Mousse de Maracujá, Morango com Chantilly.<br>
  Linha Whey Grego Havanna (40g): Dulce de Leche (Havanna), Banoffee, Brownie de Chocolate (Havanna), Dulce de Leche e Morango.<br>
  Linha Charge Bar (45g – 11g de proteína): Caramelo/Amendoim/Chocolate ao Leite (Charge), Charge Dark.<br>
  Linha Proto Bar (70g – alto teor de proteína): Coco, Creme de Avelã, Trufa de Morango (Sensations), Brownie de Chocolate com Dulce de Leche (Havanna), Dulce de Leche (Havanna).<br>
  Outras linhas (Caramel, Bacio di Latte, YoPRO): Caramelo Salgado (Bacio di Latte), Cappuccino com Nibs de Cacau e Morango com Chocolate Branco (YoPRO), Caramelo.<br>
  *Precios sujetos a alteraciones.
`;

const catalogEl = document.getElementById('catalog');
const filtersEl = document.getElementById('filters');

function render(filter) {
  catalogEl.innerHTML = '';
  const cats = filter === 'Todos' ? catalogo : catalogo.filter(c => c.categoria === filter);

  cats.forEach(cat => {
    const section = document.createElement('section');
    section.className = 'category';

    const imgKey = CATEGORY_IMAGE_KEY[cat.categoria];
    const imgList = imgKey ? IMAGES[imgKey] : null;

    const productsHTML = cat.productos.map((p, i) => {
      const src = imgList ? imgList[i] : null;
      const photoHTML = src
        ? `<div class="photo"><img src="${src}" alt="${p.nombre} - ${p.marca}" loading="lazy"></div>`
        : `<div class="photo placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>`;
      return `
      <div class="product">
        ${photoHTML}
        <div class="top">
          <span class="brand">${p.marca}</span>
          <span class="price">${p.precio}</span>
        </div>
        <div class="name">${p.nombre}</div>
        <div class="meta">
          <div><span class="label">Presentación</span><span class="value">${p.presentacion}</span></div>
          <div><span class="label">Referencia</span><span class="value">${p.referencia}</span></div>
          <div><span class="label">Uso</span><span class="value">${p.uso}</span></div>
        </div>
      </div>
    `;
    }).join('');

    section.innerHTML = `
      <h2>${cat.categoria}</h2>
      <div class="count">${cat.productos.length} producto${cat.productos.length === 1 ? '' : 's'}</div>
      <div class="rule"></div>
      <div class="grid">${productsHTML}</div>
      ${cat.categoria === 'Barras de proteína' ? `<div class="flavors-note">${flavorsNote}</div>` : ''}
    `;

    catalogEl.appendChild(section);
  });
}

function renderFilters() {
  const names = ['Todos', ...catalogo.map(c => c.categoria)];
  filtersEl.innerHTML = names.map(n =>
    `<button data-cat="${n}" class="${n === 'Todos' ? 'active' : ''}">${n}</button>`
  ).join('');

  filtersEl.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      filtersEl.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render(btn.dataset.cat);
    });
  });
}

renderFilters();
render('Todos');
</script>
